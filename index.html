function copyText(t){return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();if(!ok)throw 0})}
function openDuas(){
 if(document.querySelector('.vt-duas'))return;
 const d=document.createElement('div');d.className='vt-duas';
 d.innerHTML=`<div class="vd-box" role="dialog" aria-modal="true" aria-label="أدعية"><button type="button" class="vd-x" aria-label="إغلاق">✕</button><h3>🤲 أدعية للطالب</h3><p class="vd-sub">اختر نوع الدعاء</p><div class="vd-tabs"></div><div class="vd-list"></div><p class="vd-end">بالتوفيق والنجاح في الباك 🤍</p></div>`;
 const tabs=d.querySelector('.vd-tabs'),list=d.querySelector('.vd-list');
 DUA_GROUPS.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.className='vd-tab';b.dataset.g=g.id;b.textContent=g.name;tabs.appendChild(b)});
 function show(id){
  tabs.querySelectorAll('.vd-tab').forEach(b=>b.classList.toggle('on',b.dataset.g===id));
  const g=DUA_GROUPS.find(x=>x.id===id);list.textContent='';list.scrollTop=0;
  g.items.forEach(([t,src])=>{const c=document.createElement('div');c.className='vd-card';
   const a=document.createElement('div');a.className='vd-t';a.textContent=t;
   const f=document.createElement('div');f.className='vd-foot';
   const sp=document.createElement('span');sp.textContent=src;
   const cb=document.createElement('button');cb.type='button';cb.className='vd-copy';cb.textContent='📋 نسخ';cb.dataset.t=t;
   f.append(sp,cb);c.append(a,f);list.appendChild(c)})}
 show('succ');
 const close=()=>{d.remove();document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',onKey);
 d.addEventListener('click',async e=>{
  if(e.target===d||e.target.closest('.vd-x')){close();return}
  const tb=e.target.closest('.vd-tab');if(tb){show(tb.dataset.g);return}
  const cb=e.target.closest('.vd-copy');if(cb){try{await copyText(cb.dataset.t);toast('تم نسخ الدعاء ✅')}catch(_){toast('حدّد الدعاء وانسخه يدويًا')}}
 });
 document.body.appendChild(d);d.querySelector('.vd-tab.on').focus();
}
w.querySelector('.fab').onclick=()=>openDuas();
if(!(matchMedia('(display-mode:standalone)').matches||navigator.standalone)){$('#vtInstall').style.display='flex'}
w.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='wa')open('https://wa.me/?text='+encodeURIComponent(MSG+URL_));
 if(a==='tg')open('https://t.me/share/url?url='+encodeURIComponent(URL_)+'&text='+encodeURIComponent(MSG));
 if(a==='cp'){try{await navigator.clipboard.writeText(URL_);toast('تم نسخ الرابط ✅')}catch(_){prompt('انسخ الرابط:',URL_)}}
 if(a==='du')openDuas();
 if(a==='in'){if(dip){dip.prompt();dip=null}else if(/iphone|ipad|ipod/i.test(navigator.userAgent))iosGuide();else toast('افتح قائمة المتصفح ⋮ ثم «تثبيت التطبيق» أو «حفظ ومشاركة ← تثبيت» 📲')}
 w.classList.remove('open')});
document.addEventListener('click',e=>{if(!w.contains(e.target))w.classList.remove('open')});

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone;
function showInstall(){const c=document.getElementById('installCard');if(!c)return;let x=0;try{x=+localStorage.getItem('vt_inst_x')||0}catch(_){}
 const mobile=/android|iphone|ipad|ipod/i.test(navigator.userAgent);
 c.style.display=(!standalone&&mobile&&Date.now()-x>6048e5)?'':'none'}
function iosGuide(){const d=document.createElement('div');d.className='vt-win';d.innerHTML=`<div><div class="tr">📲</div><h3>ثبّت التطبيق على آيفون</h3><ol class="ios-steps"><li>افتح الموقع من <b>سفاري</b></li><li>اضغط زر المشاركة ⬆️ في الأسفل</li><li>اختر «إضافة إلى الشاشة الرئيسية»</li></ol><button class="btn lg cta-go">فهمت ✓</button></div>`;d.onclick=e=>{if(e.target===d||e.target.closest('button'))d.remove()};document.body.appendChild(d)}
document.addEventListener('click',e=>{
 if(e.target.closest('#installX')){try{localStorage.setItem('vt_inst_x',Date.now())}catch(_){}document.getElementById('installCard').style.display='none';return}
 if(e.target.closest('#installGo')){if(dip){dip.prompt();dip.userChoice&&dip.userChoice.then(()=>{dip=null});}else if(isIOS)iosGuide();else toast('افتح قائمة المتصفح ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»')}});
new MutationObserver(showInstall).observe(document.body,{childList:true,subtree:true});showInstall();
addEventListener('appinstalled',()=>{const v=$('#vtInstall');if(v)v.style.display='none';toast('تم تثبيت التطبيق 🎉')});
// احتفال عند بلوغ إنجازات الوحدات
function confetti(){const c=document.createElement('canvas');c.id='vtConfetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),col=['#ffd23f','#ff4d6d','#3a5ef7','#2ecc71','#fff'];
 const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:col[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));let t=0;
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<170)requestAnimationFrame(f);else c.remove()})()}
function win(u){confetti();navigator.vibrate&&navigator.vibrate([80,40,120]);const d=document.createElement('div');d.className='vt-win';
 d.innerHTML=`<div><div class="tr">🏆</div><h3>مبروك! أتقنت الوحدة</h3><p>${u.titleAr||u.title}<br>أنت أقرب للعلامة الكاملة 💪</p><button class="btn lg cta-go">كمّل التقدم ▶</button></div>`;
 d.onclick=e=>{if(e.target===d||e.target.closest('button'))d.remove()};document.body.appendChild(d)}
const K='vt_ms';let seen={};try{seen=JSON.parse(localStorage.getItem(K)||'{}')}catch(_){}
let first=true,tm;
function check(){ if(typeof UNITS==='undefined'||typeof masteryPct!=='function')return;
 Object.keys(UNITS).forEach(id=>{const u=UNITS[id];if(!u||!u.terms)return;const p=masteryPct(u.terms),was=seen[id]||0,ms=[25,50,75,100].filter(m=>p>=m).pop()||0;
  if(ms>was){seen[id]=ms;try{localStorage.setItem(K,JSON.stringify(seen))}catch(_){}
   if(!first){ms===100?win(u):toast('🎯 وصلت '+ms+'% في '+(u.titleAr||u.title))}}});first=false}
const later=()=>{clearTimeout(tm);tm=setTimeout(check,500)};
document.addEventListener('click',later);document.addEventListener('keyup',later);setTimeout(check,800);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!hadSW || reloaded) return; reloaded = true; location.reload(); });
  addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg=>{
      const chk = ()=>{ try{ reg.update(); }catch(e){} };
      chk(); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) chk(); }); setInterval(chk, 30*60*1000);
    }).catch(()=>{});
  });
}
})();
</script>

(function(){

  const petals = [0,72,144,216,288].map(a=>`<ellipse cx="50" cy="27" rx="14" ry="22" transform="rotate(${a} 50 50)"/>`).join('');
  const svg = c => `<svg viewBox="0 0 100 100" aria-hidden="true" style="--c1:${c[0]};--c2:${c[1]}"><g fill="var(--c1)" stroke="rgba(190,40,120,.28)" stroke-width="1.5">${petals}</g><circle cx="50" cy="50" r="11" fill="var(--c2)"/><circle cx="47" cy="47" r="4" fill="#fff" fill-opacity=".55"/></svg>`;

    const d = document.createElement('div'); d.className = 'bf';
    d.style.cssText = `--x:${(Math.random()*94).toFixed(1)}%;--s:${(20+Math.random()*24).toFixed(0)}px;--d:${(24+Math.random()*20).toFixed(1)}s;--dl:-${(Math.random()*36).toFixed(1)}s;--dx:${((Math.random()-.5)*160).toFixed(0)}px;--r:${(10+Math.random()*14).toFixed(1)}s`;

})();
